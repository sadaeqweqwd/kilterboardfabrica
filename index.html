<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark">
<title>Kilter Board Editor</title>
<style>
  :root{--bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--txt:#e8eaf0;--mut:#8b93a5;--acc:#4da3ff;--z:100;color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  header{position:sticky;top:0;z-index:20;display:flex;gap:8px;align-items:center;justify-content:space-between;
    padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 8px calc(12px + env(safe-area-inset-left,0px));
    background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{font-size:15px;margin:0}
  button,input{background:#222733;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:16px;min-height:42px}
  button{cursor:pointer;touch-action:manipulation}
  button:active{border-color:var(--acc)}
  button.on{outline:2px solid #fff}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:#1d4f91;border-color:#2f6fc0}
  #status{color:var(--mut);font-size:13px;flex:1 1 100%}
  #status.ok{color:#4cd964}
  .hbtns{display:flex;gap:8px}
  main{padding:10px calc(12px + env(safe-area-inset-right,0px)) 10px calc(12px + env(safe-area-inset-left,0px));display:grid;gap:10px;max-width:1000px;margin:0 auto}
  #warn{display:none;background:#3a2a10;border:1px solid #7a5a20;color:#ffd9a0;border-radius:8px;padding:10px;font-size:13px;line-height:1.4}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  #palette{position:sticky;top:var(--hh,60px);z-index:15;background:var(--bg);padding:6px 0;flex-wrap:nowrap;overflow-x:auto}
  #palette button,#palette input{flex:0 0 auto}
  #palette input[type=color]{width:48px;padding:2px}
  label{color:var(--mut);display:flex;gap:8px;align-items:center;font-size:14px}
  input[type=number]{width:84px}
  input[type=checkbox]{width:22px;height:22px;min-height:0}
  input[type=range]{padding:0;min-height:30px;flex:1;min-width:120px}
  details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  summary{cursor:pointer;padding:4px 0;font-size:14px}
  details .bar{margin-top:8px}
  #count{color:var(--mut);font-size:13px}
  #wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#0b0d12;padding:6px;max-height:68vh}
  #board{position:relative;width:calc(var(--z) * 1%);margin:0 auto;background:#14171e;border:1px solid var(--line);border-radius:6px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  #board.drawing{touch-action:none}
  .dot{position:absolute;width:3%;min-width:12px;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#262b37;border:1px solid #3a4050;cursor:pointer;padding:0;min-height:0}
  .dot::after{content:"";position:absolute;inset:-5px}
  .dot.screw{width:2.2%;min-width:10px;background:#20242e}
  .dot.kick{width:3.6%;min-width:14px;border-radius:30%}
  .dot.lit{border:2px solid #fff;box-shadow:0 0 6px currentColor}
  .divider{position:absolute;left:0;right:0;height:0;border-top:2px dashed #3a4050;pointer-events:none}
  .divlabel{position:absolute;left:6px;font-size:10px;color:#5b6376;pointer-events:none}
  #log{background:#0a0c10;border:1px solid var(--line);border-radius:6px;padding:8px;height:150px;overflow:auto;font:12px ui-monospace,Menlo,monospace;color:var(--mut);white-space:pre-wrap}
  #dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;
    padding:8px calc(12px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));
    background:var(--panel);border-top:1px solid var(--line)}
  #dock button{flex:1}
  @media (min-width:900px){#status{flex:0 1 auto}#wrap{max-height:none}#board{max-width:900px}}
</style>
</head>
<body>
<header id="head">
  <h1>Kilter Board Editor</h1>
  <div class="hbtns">
    <button id="connect" class="primary">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>
  </div>
  <span id="status">Not connected</span>
</header>

<main>
  <div id="warn"></div>
  <div class="bar" id="palette"></div>
  <div class="bar">
    <label><input type="checkbox" id="drag"> Drag to paint</label>
    <label><input type="checkbox" id="auto"> Auto-send</label>
    <span id="count"></span>
  </div>
  <div class="bar"><label style="flex:1">Zoom <input type="range" id="zoom" min="100" max="300" value="100"></label></div>
  <div id="wrap"><div id="board"></div></div>

  <details>
    <summary>Layout, files and tools</summary>
    <div class="bar">
      <label>First LED <input type="number" id="first" value="1" min="0" inputmode="numeric"></label>
      <label>Kickboard rows <input type="number" id="kickrows" value="2" min="0" max="2" inputmode="numeric"></label>
    </div>
    <div class="bar">
      <button id="fillAll">Light every hold</button>
      <button id="clearAll">Clear editor</button>
      <button id="sweep" disabled>Sweep test</button>
    </div>
    <div class="bar">
      <button id="save">Save climb</button>
      <button id="load">Load climb</button>
      <button id="loadLayout">Import layout JSON</button>
      <button id="dropLayout">Reset to default</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </details>
  <details><summary>Log</summary><div id="log"></div></details>
</main>

<div id="dock">
  <button id="send" class="primary" disabled>Send to board</button>
  <button id="clearBoard" disabled>Clear board</button>
</div>

<script>
"use strict";
const ADV_SERVICE_UUID  = "4488b571-7806-4df6-bcff-a2897e4953ff";
const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const CHAR_UUID         = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const HOLDS_PER_PACKET = 84;
const BLE_CHUNK = 20;
const CMD = { SINGLE: 84, FIRST: 82, MIDDLE: 81, LAST: 83 };
const COLORS = { Start:"#00FF00", Hand:"#00FFFF", Finish:"#FF00FF", Foot:"#FFFF00", Custom:"#FF8000" };

const state = { device:null, server:null, chr:null, holds:new Map(), tool:"Hand", erase:false,
  layout:[], geom:null, kickDivider:null, sending:false, pending:false };
const $ = id => document.getElementById(id);
const log = m => { const l=$("log"); l.textContent += `[${new Date().toLocaleTimeString()}] ${m}\n`; l.scrollTop = l.scrollHeight; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function encodeColor(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return ((r>>5)<<5)|((g>>5)<<2)|(b>>6);}
function encodeHold(pos,hex){return [pos&255,(pos>>8)&255,encodeColor(hex)];}
function wrap(data){let s=0;for(const b of data)s=(s+b)&255;return [1,data.length,s^255,2,...data,3];}
function buildStream(map){
  const entries=[...map.entries()],groups=[];
  for(let i=0;i<entries.length;i+=HOLDS_PER_PACKET)groups.push(entries.slice(i,i+HOLDS_PER_PACKET));
  if(!groups.length)groups.push([]);
  return groups.map((g,i)=>{
    let cmd; if(groups.length===1)cmd=CMD.SINGLE; else if(i===0)cmd=CMD.FIRST; else if(i===groups.length-1)cmd=CMD.LAST; else cmd=CMD.MIDDLE;
    const data=[cmd]; for(const [p,c] of g)data.push(...encodeHold(p,c)); return wrap(data);
  }).flat();
}
async function writeStream(bytes){
  for(let i=0;i<bytes.length;i+=BLE_CHUNK){
    const chunk=new Uint8Array(bytes.slice(i,i+BLE_CHUNK));
    if(state.chr.writeValueWithoutResponse)await state.chr.writeValueWithoutResponse(chunk); else await state.chr.writeValue(chunk);
    await sleep(20);
  }
}

function setStatus(t,ok){const s=$("status");s.textContent=t;s.className=ok?"ok":"";}
function setConnectedUI(c){$("connect").disabled=c;$("disconnect").disabled=!c;$("send").disabled=!c;$("clearBoard").disabled=!c;$("sweep").disabled=!c;}
function showCompatWarning(msgOverride){
  const w=$("warn");
  if(!msgOverride && navigator.bluetooth && window.isSecureContext) return;
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  let msg;
  if(msgOverride) msg=msgOverride;
  else if(!window.isSecureContext) msg="This page needs https:// to use Bluetooth. You can still design climbs here.";
  else if(ios) msg="Safari and Chrome on iPhone/iPad don't support Web Bluetooth. Open this link in the free Bluefy browser. You can still design climbs here.";
  else msg="This browser doesn't support Web Bluetooth. Use Chrome or Edge on Android or desktop. You can still design climbs here.";
  w.textContent=msg; w.style.display="block";
}
async function connect(){
  if(!navigator.bluetooth){showCompatWarning();log("Web Bluetooth unavailable in this browser.");return;}
  try{
    log("Requesting device...");
    const dev=await navigator.bluetooth.requestDevice({
      filters:[{namePrefix:"Kilter"},{services:[ADV_SERVICE_UUID]}],
      optionalServices:[UART_SERVICE_UUID,ADV_SERVICE_UUID]});
    state.device=dev; log(`Picked: ${dev.name||"(unnamed)"}`);
    dev.addEventListener("gattserverdisconnected",onDisconnect);
    state.server=await dev.gatt.connect();
    log("GATT connected. Discovering services...");
    const services=await state.server.getPrimaryServices();
    log("Services: "+services.map(s=>s.uuid).join(", "));
    let chr=null;
    for(const svc of services){try{const c=await svc.getCharacteristic(CHAR_UUID);if(c){chr=c;log(`Write characteristic found in ${svc.uuid}`);break;}}catch(_){}}
    if(!chr)throw new Error("Write characteristic not found. See the services list above.");
    state.chr=chr; setStatus(`Connected: ${dev.name||"board"}`,true); setConnectedUI(true); log("Ready to send.");
  }catch(e){
    log("Connect failed: "+e.name+": "+e.message); setStatus("Not connected");
    if(e.name==="SecurityError"||/permissions? policy|not allowed/i.test(e.message||""))
      showCompatWarning("Bluetooth is blocked inside this embedded view. Open the page's direct link in its own browser tab and try again.");
  }
}
function onDisconnect(){log("Disconnected.");state.chr=null;state.server=null;setStatus("Not connected");setConnectedUI(false);}
function disconnect(){if(state.device?.gatt.connected)state.device.gatt.disconnect();}
async function sendHolds(map=state.holds){
  if(!state.chr){log("Not connected.");return;}
  if(state.sending){state.pending=true;return;}
  state.sending=true;
  try{const s=buildStream(map);await writeStream(s);log(`Sent ${map.size} holds (${s.length} bytes).`);}
  catch(e){log("Send failed: "+e.message);}
  finally{state.sending=false;if(state.pending){state.pending=false;sendHolds();}}
}
async function sweep(){
  const positions=state.layout.map(h=>h.position).sort((a,b)=>a-b);
  log(`Sweep started over ${positions.length} positions.`);
  for(const p of positions){if(!state.chr)break;await sendHolds(new Map([[p,"#00FF00"]]));$("count").textContent=`Sweep: LED ${p}`;await sleep(150);}
  await sendHolds(new Map()); updateCount(); log("Sweep finished.");
}

function buildDefaultLayout(start,kickRows){
  const L=[];let p=start;
  const raw=BOARD_DATA.split(";").map(s=>{const [x,y,t]=s.split(",");return {x:+x,y:+y,t};});
  const kept=raw.filter(h=>!(h.t==="1"&&kickRows<1)&&!(h.t==="2"&&kickRows<2));
  kept.sort((a,b)=>(Math.round(a.y/4)-Math.round(b.y/4))||(a.x-b.x));
  for(const h of kept)L.push({position:p++,x:h.x,y:h.y,type:(h.t==="1"||h.t==="2")?"kick":(h.t==="s"?"screw":"bolt")});
  return L;
}
function useDefaultLayout(){
  const rows=Math.min(2,Math.max(0,parseInt($("kickrows").value,10)||0));
  state.layout=buildDefaultLayout(Math.max(0,+$("first").value||0),rows);
  const xs=state.layout.map(h=>h.x),ys=state.layout.map(h=>h.y),pad=10;
  state.geom={minX:Math.min(...xs)-pad,maxX:Math.max(...xs)+pad,minY:Math.min(...ys)-pad,maxY:Math.max(...ys)+pad};
  const kick=state.layout.filter(h=>h.type==="kick").map(h=>h.y),wall=state.layout.filter(h=>h.type!=="kick").map(h=>h.y);
  state.kickDivider=kick.length?(Math.max(...kick)+Math.min(...wall))/2:null;
}
function useImportedLayout(arr){
  state.layout=arr.map(h=>({position:Number(h.position),x:Number(h.x),y:Number(h.y),type:h.type||"bolt"}));
  const xs=state.layout.map(h=>h.x),ys=state.layout.map(h=>h.y),pad=4;
  state.geom={minX:Math.min(...xs)-pad,maxX:Math.max(...xs)+pad,minY:Math.min(...ys)-pad,maxY:Math.max(...ys)+pad}; state.kickDivider=null;
}

function currentColor(){return COLORS[state.tool];}
function updateCount(){$("count").textContent=`${state.holds.size}/${state.layout.length} lit (no limit)`;}
function setHold(pos,mode){if(mode==="erase")state.holds.delete(pos);else state.holds.set(pos,currentColor());renderOne(pos);}
function paint(pos){
  const mode=(state.erase||state.holds.get(pos)===currentColor())?"erase":"add";
  setHold(pos,mode);updateCount();if($("auto").checked)sendHolds();
}
function styleEl(el,pos){const c=state.holds.get(pos);el.style.background=c||"";el.style.color=c||"";el.classList.toggle("lit",!!c);}
function renderOne(pos){const el=document.querySelector(`[data-pos="${pos}"]`);if(el)styleEl(el,pos);}
function renderBoard(){
  const board=$("board");board.innerHTML="";
  const g=state.geom,w=g.maxX-g.minX,h=g.maxY-g.minY; 
  board.style.aspectRatio=`${w} / ${h}`;
  if(state.kickDivider!==null){
    const top=100*(1-(state.kickDivider-g.minY)/h);
    const d=document.createElement("div");d.className="divider";d.style.top=top+"%";board.appendChild(d);
    const lb=document.createElement("div");lb.className="divlabel";lb.textContent="kickboard";lb.style.top=`calc(${top}% + 4px)`;board.appendChild(lb);
  }
  const frag=document.createDocumentFragment();
  for(const hd of state.layout){
    const d=document.createElement("button");
    d.className="dot"+(hd.type==="screw"?" screw":hd.type==="kick"?" kick":"");
    d.dataset.pos=hd.position;d.title=`LED ${hd.position}`;
    d.style.left=(100*(hd.x-g.minX)/w)+"%";d.style.top=(100*(1-(hd.y-g.minY)/h))+"%";
    d.addEventListener("click",()=>{if(!$("drag").checked)paint(hd.position);});
    styleEl(d,hd.position);frag.appendChild(d);
  }
  board.appendChild(frag);updateCount();
}

const drag={active:false,mode:null,seen:new Set()};
function dotAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.dataset&&el.dataset.pos!==undefined?el:null;}
function dragApply(e){
  const el=dotAt(e.clientX,e.clientY);if(!el)return;
  const pos=Number(el.dataset.pos);if(drag.seen.has(pos))return;drag.seen.add(pos);
  if(drag.mode===null)drag.mode=(state.erase||state.holds.get(pos)===currentColor())?"erase":"add";
  setHold(pos,drag.mode);updateCount();
}
$("board").addEventListener("pointerdown",e=>{
  if(!$("drag").checked)return;
  drag.active=true;drag.mode=null;drag.seen=new Set();
  $("board").setPointerCapture(e.pointerId);dragApply(e);e.preventDefault();
});
$("board").addEventListener("pointermove",e=>{if(drag.active){dragApply(e);e.preventDefault();}});
function endDrag(){if(!drag.active)return;drag.active=false;if($("auto").checked)sendHolds();}
$("board").addEventListener("pointerup",endDrag);
$("board").addEventListener("pointercancel",endDrag);
$("drag").addEventListener("change",()=>{
  $("board").classList.toggle("drawing",$("drag").checked);
  log($("drag").checked?"Drag paint on. Scrolling the board is off.":"Drag paint off. Tap holds.");
});

function buildPalette(){
  const bar=$("palette");
  for(const name of Object.keys(COLORS)){
    const b=document.createElement("button");b.textContent=name;b.dataset.tool=name;b.style.borderColor=COLORS[name];
    b.addEventListener("click",()=>{state.tool=name;state.erase=false;refreshPalette();});bar.appendChild(b);
  }
  const pick=document.createElement("input");pick.type="color";pick.value=COLORS.Custom;pick.title="Custom color";
  pick.addEventListener("input",e=>{COLORS.Custom=e.target.value.toUpperCase();state.tool="Custom";state.erase=false;refreshPalette();});
  bar.appendChild(pick);
  const er=document.createElement("button");er.textContent="Erase";er.dataset.tool="__erase";
  er.addEventListener("click",()=>{state.erase=true;refreshPalette();});bar.appendChild(er);
  refreshPalette();
}
function refreshPalette(){
  document.querySelectorAll("#palette button").forEach(b=>{
    const t=b.dataset.tool;b.classList.toggle("on",t==="__erase"?state.erase:(!state.erase&&t===state.tool));
  });
}

function download(name,obj){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
let fileMode=null;
function pickFile(mode){fileMode=mode;$("file").value="";$("file").click();}
$("file").addEventListener("change",async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text());
    if(fileMode==="climb"){
      if(!Array.isArray(data.holds))throw new Error("Expected {holds:[{position,color}]}");
      state.holds=new Map(data.holds.map(h=>[Number(h.position),String(h.color).toUpperCase()]));
      renderBoard();log(`Loaded ${state.holds.size} holds.`);
    }else{
      const arr=Array.isArray(data)?data:data.layout;
      if(!Array.isArray(arr)||!arr.every(h=>"position" in h&&"x" in h&&"y" in h))throw new Error("Expected [{position,x,y,type?}]");
      useImportedLayout(arr);renderBoard();log(`Layout loaded: ${arr.length} positions.`);
    }
  }catch(err){log("Load failed: "+err.message);}
});

function resetDefault(msg){state.holds.clear();useDefaultLayout();renderBoard();log(msg);}
function syncHeaderHeight(){document.documentElement.style.setProperty("--hh",$("head").offsetHeight+"px");}
$("connect").onclick=connect;
$("disconnect").onclick=disconnect;
$("send").onclick=()=>sendHolds();
$("clearBoard").onclick=()=>sendHolds(new Map());
$("clearAll").onclick=()=>{state.holds.clear();renderBoard();if($("auto").checked)sendHolds();};
$("fillAll").onclick=()=>{
  const c=state.erase?COLORS.Hand:currentColor();
  for(const h of state.layout)state.holds.set(h.position,c);
  renderBoard();if($("auto").checked)sendHolds();
};
$("sweep").onclick=sweep;
$("zoom").addEventListener("input",()=>document.documentElement.style.setProperty("--z",$("zoom").value));
$("first").addEventListener("change",()=>resetDefault("Default layout renumbered. Editor cleared."));
$("kickrows").addEventListener("change",()=>resetDefault(`Kickboard set to ${$("kickrows").value} rows. Editor cleared.`));
$("dropLayout").onclick=()=>resetDefault("Default layout restored.");
$("save").onclick=()=>download("climb.json",{holds:[...state.holds].map(([position,color])=>({position,color}))});
$("load").onclick=()=>pickFile("climb");
$("loadLayout").onclick=()=>pickFile("layout");
window.addEventListener("resize",syncHeaderHeight);

buildPalette();useDefaultLayout();renderBoard();showCompatWarning();
syncHeaderHeight();setTimeout(syncHeaderHeight,300);
log("Ready. Connect, tap holds, hit Send. Lit holds are unlimited.");
