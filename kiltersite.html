<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilter Original 12x12 + Adjustable Kickboard</title>
<style>
  :root{--bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--txt:#e8eaf0;--mut:#8b93a5;--acc:#4da3ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,sans-serif}
  header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{font-size:16px;margin:0}
  button,select,input{background:#222733;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font:inherit}
  button{cursor:pointer} button:hover{border-color:var(--acc)}
  button.on{outline:2px solid #fff}
  button:disabled{opacity:.4;cursor:not-allowed}
  #status{color:var(--mut)} #status.ok{color:#4cd964}
  main{padding:14px 16px;display:grid;gap:14px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  label{color:var(--mut);display:flex;gap:6px;align-items:center}
  input[type=number]{width:80px}
  #wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#0b0d12;padding:10px}
  #board{position:relative;margin:0 auto;background:#14171e;border:1px solid var(--line);border-radius:6px;touch-action:manipulation}
  .dot{position:absolute;width:3%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:#262b37;border:1px solid #3a4050;cursor:pointer;padding:0}
  .dot.screw{width:2.2%;background:#20242e}
  .dot.kick{width:3.6%;border-radius:30%}
  .dot.lit{border:2px solid #fff;box-shadow:0 0 6px currentColor}
  .divider{position:absolute;left:0;right:0;height:0;border-top:2px dashed #3a4050;pointer-events:none}
  .divlabel{position:absolute;left:6px;font-size:10px;color:#5b6376;pointer-events:none}
  #log{background:#0a0c10;border:1px solid var(--line);border-radius:6px;padding:8px;height:130px;overflow:auto;font:12px ui-monospace,monospace;color:var(--mut);white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <h1>Kilter Original 12x12 + Kickboard</h1>
  <button id="connect">Connect</button>
  <button id="disconnect" disabled>Disconnect</button>
  <span id="status">Not connected</span>
</header>

<main>
  <div class="bar" id="palette"></div>

  <div class="bar">
    <button id="send" disabled>Send to board</button>
    <button id="clearBoard" disabled>Clear board</button>
    <button id="clearAll">Clear editor</button>
    <button id="fillAll">Light every hold</button>
    <label><input type="checkbox" id="auto"> Auto-send on change</label>
    <button id="sweep" disabled>Sweep test</button>
    <span id="count" style="color:var(--mut)"></span>
  </div>

  <div class="bar">
    <label>First LED position <input type="number" id="first" value="1" min="0"></label>
    <label>Kickboard rows <input type="number" id="kickrows" value="2" min="0" max="4"></label>
    <label>Board width <input type="range" id="zoom" min="320" max="1400" value="760"></label>
    <button id="save">Save climb</button>
    <button id="load">Load climb</button>
    <button id="loadLayout">Import real layout JSON</button>
    <button id="dropLayout">Reset to 12x12 default</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>

  <div id="wrap"><div id="board"></div></div>
  <div id="log"></div>
</main>

<script>
"use strict";

/* ---------- Constants ---------- */
const ADV_SERVICE_UUID  = "4488b571-7806-4df6-bcff-a2897e4953ff"; // advertising only
const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e"; // holds the write characteristic
const CHAR_UUID         = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const HOLDS_PER_PACKET = 84;  // 1 cmd byte + 84*3 = 253, under the 255-byte body limit
const BLE_CHUNK = 20;
const CMD = { SINGLE: 84, FIRST: 82, MIDDLE: 81, LAST: 83 };

const COLORS = {
  Start:  "#00FF00",
  Hand:   "#00FFFF",
  Finish: "#FF00FF",
  Foot:   "#FFFF00",
  Custom: "#FF8000"
};

/* ---------- State ---------- */
const state = {
  device: null, server: null, chr: null,
  holds: new Map(),
  tool: "Hand", erase: false,
  layout: [], geom: null, kickDivider: null,
  sending: false, pending: false
};

const $ = id => document.getElementById(id);
const log = m => { const l = $("log"); l.textContent += `[${new Date().toLocaleTimeString()}] ${m}\n`; l.scrollTop = l.scrollHeight; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Protocol ---------- */
function encodeColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return ((r >> 5) << 5) | ((g >> 5) << 2) | (b >> 6);   // RRRGGGBB
}
function encodeHold(pos, hex) { return [pos & 255, (pos >> 8) & 255, encodeColor(hex)]; }
function wrap(data) {
  let sum = 0; for (const b of data) sum = (sum + b) & 255;
  return [1, data.length, sum ^ 255, 2, ...data, 3];
}
function buildStream(holdsMap) {
  const entries = [...holdsMap.entries()];
  const groups = [];
  for (let i = 0; i < entries.length; i += HOLDS_PER_PACKET) groups.push(entries.slice(i, i + HOLDS_PER_PACKET));
  if (!groups.length) groups.push([]);
  const packets = groups.map((g, i) => {
    let cmd;
    if (groups.length === 1) cmd = CMD.SINGLE;
    else if (i === 0) cmd = CMD.FIRST;
    else if (i === groups.length - 1) cmd = CMD.LAST;
    else cmd = CMD.MIDDLE;
    const data = [cmd];
    for (const [p, c] of g) data.push(...encodeHold(p, c));
    return wrap(data);
  });
  return packets.flat();
}
async function writeStream(bytes) {
  for (let i = 0; i < bytes.length; i += BLE_CHUNK) {
    const chunk = new Uint8Array(bytes.slice(i, i + BLE_CHUNK));
    if (state.chr.writeValueWithoutResponse) await state.chr.writeValueWithoutResponse(chunk);
    else await state.chr.writeValue(chunk);
    await sleep(20);
  }
}

/* ---------- Connection ---------- */
function setStatus(t, ok) { const s = $("status"); s.textContent = t; s.className = ok ? "ok" : ""; }
function setConnectedUI(c) {
  $("connect").disabled = c; $("disconnect").disabled = !c;
  $("send").disabled = !c; $("clearBoard").disabled = !c; $("sweep").disabled = !c;
}
async function connect() {
  if (!navigator.bluetooth) { alert("Web Bluetooth unavailable. Use Chrome/Edge on desktop or Android over HTTPS/localhost."); return; }
  try {
    log("Requesting device...");
    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ namePrefix: "Kilter" }, { services: [ADV_SERVICE_UUID] }],
      optionalServices: [UART_SERVICE_UUID, ADV_SERVICE_UUID]
    });
    state.device = dev;
    log(`Picked: ${dev.name || "(unnamed)"}`);
    dev.addEventListener("gattserverdisconnected", onDisconnect);
    state.server = await dev.gatt.connect();
    log("GATT connected. Discovering services...");

    const services = await state.server.getPrimaryServices();
    log("Services: " + services.map(s => s.uuid).join(", "));

    let chr = null;
    for (const svc of services) {
      try {
        const c = await svc.getCharacteristic(CHAR_UUID);
        if (c) { chr = c; log(`Write characteristic found in ${svc.uuid}`); break; }
      } catch (_) { /* not in this service */ }
    }
    if (!chr) throw new Error("Write characteristic not found. See the services list above.");

    state.chr = chr;
    setStatus(`Connected: ${dev.name || "board"}`, true);
    setConnectedUI(true);
    log("Ready to send.");
  } catch (e) {
    log("Connect failed: " + e.name + ": " + e.message);
    setStatus("Not connected");
  }
}
function onDisconnect() {
  log("Disconnected.");
  state.chr = null; state.server = null;
  setStatus("Not connected"); setConnectedUI(false);
}
function disconnect() { if (state.device?.gatt.connected) state.device.gatt.disconnect(); }

async function sendHolds(map = state.holds) {
  if (!state.chr) { log("Not connected."); return; }
  if (state.sending) { state.pending = true; return; }
  state.sending = true;
  try {
    const stream = buildStream(map);
    await writeStream(stream);
    log(`Sent ${map.size} holds (${stream.length} bytes).`);
  } catch (e) {
    log("Send failed: " + e.message);
  } finally {
    state.sending = false;
    if (state.pending) { state.pending = false; sendHolds(); }
  }
}
async function sweep() {
  const positions = state.layout.map(h => h.position).sort((a, b) => a - b);
  log(`Sweep started over ${positions.length} positions. Note which hold lights for each number.`);
  for (const p of positions) {
    if (!state.chr) break;
    await sendHolds(new Map([[p, "#00FF00"]]));
    $("count").textContent = `Sweep: LED position ${p}`;
    await sleep(150);
  }
  await sendHolds(new Map());
  updateCount();
  log("Sweep finished.");
}

/* ---------- Default 12x12 + adjustable kickboard layout ----------
   Units are inches. Main wall 144 x 144. Bolt-ons on an 8" grid (17 x 17),
   screw-ons on the offset 8" grid (16 x 16). The kickboard sits below the wall
   with 'kickRows' rows of 17 holds (default 2), 8" apart.
   LED numbers are assigned sequentially: kickboard rows first (lowest row first),
   then the wall row by row, bottom to top.
   Real boards number LEDs from their own database. Use Sweep or Import to match yours. */
function buildDefaultLayout(start, kickRows) {
  const L = [];
  let p = start;
  for (let k = 0; k < kickRows; k++) {
    const y = -8 - k * 8;
    for (let c = 0; c < 17; c++) L.push({ position: p++, x: 8 + c * 8, y, type: "kick" });
  }
  for (let r = 0; r < 17; r++) {
    const y = 8 + r * 8;
    for (let c = 0; c < 17; c++) L.push({ position: p++, x: 8 + c * 8, y, type: "bolt" });
    if (r < 16) for (let c = 0; c < 16; c++) L.push({ position: p++, x: 12 + c * 8, y: y + 4, type: "screw" });
  }
  return L;
}
function useDefaultLayout() {
  const rows = Math.min(4, Math.max(0, parseInt($("kickrows").value, 10) || 0));
  state.layout = buildDefaultLayout(Math.max(0, +$("first").value || 0), rows);
  const bottom = rows ? -8 - (rows - 1) * 8 - 8 : -2;
  state.geom = { minX: 0, maxX: 144, minY: bottom, maxY: 146 };
  state.kickDivider = rows ? 2 : null;
}
function useImportedLayout(arr) {
  state.layout = arr.map(h => ({ position: Number(h.position), x: Number(h.x), y: Number(h.y), type: h.type || "bolt" }));
  const xs = state.layout.map(h => h.x), ys = state.layout.map(h => h.y);
  const pad = 4;
  state.geom = { minX: Math.min(...xs) - pad, maxX: Math.max(...xs) + pad, minY: Math.min(...ys) - pad, maxY: Math.max(...ys) + pad };
  state.kickDivider = null;
}

/* ---------- Editor ---------- */
function currentColor() { return COLORS[state.tool]; }
function updateCount() { $("count").textContent = `${state.holds.size} of ${state.layout.length} holds lit (no limit)`; }
function paint(pos) {
  if (state.erase || state.holds.get(pos) === currentColor()) state.holds.delete(pos);
  else state.holds.set(pos, currentColor());
  renderOne(pos); updateCount();
  if ($("auto").checked) sendHolds();
}
function styleEl(el, pos) {
  const c = state.holds.get(pos);
  el.style.background = c || ""; el.style.color = c || "";
  el.classList.toggle("lit", !!c);
}
function renderOne(pos) {
  const el = document.querySelector(`[data-pos="${pos}"]`);
  if (el) styleEl(el, pos);
}
function renderBoard() {
  const board = $("board");
  board.innerHTML = "";
  const g = state.geom, w = g.maxX - g.minX, h = g.maxY - g.minY;
  board.style.width = $("zoom").value + "px";
  board.style.aspectRatio = `${w} / ${h}`;
  if (state.kickDivider !== null) {
    const d = document.createElement("div");
    d.className = "divider";
    d.style.top = (100 * (1 - (state.kickDivider - g.minY) / h)) + "%";
    board.appendChild(d);
    const lb = document.createElement("div");
    lb.className = "divlabel"; lb.textContent = "kickboard";
    lb.style.top = `calc(${100 * (1 - (state.kickDivider - g.minY) / h)}% + 4px)`;
    board.appendChild(lb);
  }
  const frag = document.createDocumentFragment();
  for (const hd of state.layout) {
    const d = document.createElement("button");
    d.className = "dot" + (hd.type === "screw" ? " screw" : hd.type === "kick" ? " kick" : "");
    d.dataset.pos = hd.position; d.title = `LED ${hd.position}`;
    d.style.left = (100 * (hd.x - g.minX) / w) + "%";
    d.style.top = (100 * (1 - (hd.y - g.minY) / h)) + "%";
    d.addEventListener("click", () => paint(hd.position));
    styleEl(d, hd.position);
    frag.appendChild(d);
  }
  board.appendChild(frag);
  updateCount();
}

/* ---------- Palette ---------- */
function buildPalette() {
  const bar = $("palette");
  for (const name of Object.keys(COLORS)) {
    const b = document.createElement("button");
    b.textContent = name; b.dataset.tool = name;
    b.style.borderColor = COLORS[name];
    b.addEventListener("click", () => { state.tool = name; state.erase = false; refreshPalette(); });
    bar.appendChild(b);
  }
  const pick = document.createElement("input");
  pick.type = "color"; pick.value = COLORS.Custom; pick.title = "Custom color";
  pick.addEventListener("input", e => { COLORS.Custom = e.target.value.toUpperCase(); state.tool = "Custom"; state.erase = false; refreshPalette(); });
  bar.appendChild(pick);
  const er = document.createElement("button");
  er.textContent = "Erase"; er.dataset.tool = "__erase";
  er.addEventListener("click", () => { state.erase = true; refreshPalette(); });
  bar.appendChild(er);
  refreshPalette();
}
function refreshPalette() {
  document.querySelectorAll("#palette button").forEach(b => {
    const t = b.dataset.tool;
    b.classList.toggle("on", t === "__erase" ? state.erase : (!state.erase && t === state.tool));
  });
}

/* ---------- Save / load ---------- */
function download(name, obj) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
let fileMode = null;
function pickFile(mode) { fileMode = mode; $("file").value = ""; $("file").click(); }
$("file").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (fileMode === "climb") {
      if (!Array.isArray(data.holds)) throw new Error("Expected {holds:[{position,color}]}");
      state.holds = new Map(data.holds.map(h => [Number(h.position), String(h.color).toUpperCase()]));
      renderBoard(); log(`Loaded ${state.holds.size} holds.`);
    } else {
      const arr = Array.isArray(data) ? data : data.layout;
      if (!Array.isArray(arr) || !arr.every(h => "position" in h && "x" in h && "y" in h)) throw new Error("Expected [{position,x,y,type?}]");
      useImportedLayout(arr); renderBoard(); log(`Layout loaded: ${arr.length} positions.`);
    }
  } catch (err) { log("Load failed: " + err.message); }
});

/* ---------- Wiring ---------- */
function resetDefault(msg) { state.holds.clear(); useDefaultLayout(); renderBoard(); log(msg); }
$("connect").onclick = connect;
$("disconnect").onclick = disconnect;
$("send").onclick = () => sendHolds();
$("clearBoard").onclick = () => sendHolds(new Map());
$("clearAll").onclick = () => { state.holds.clear(); renderBoard(); if ($("auto").checked) sendHolds(); };
$("fillAll").onclick = () => {
  const c = state.erase ? COLORS.Hand : currentColor();
  for (const h of state.layout) state.holds.set(h.position, c);
  renderBoard(); if ($("auto").checked) sendHolds();
};
$("sweep").onclick = sweep;
$("zoom").addEventListener("input", () => { $("board").style.width = $("zoom").value + "px"; });
$("first").addEventListener("change", () => resetDefault("Default layout renumbered. Editor cleared."));
$("kickrows").addEventListener("change", () => resetDefault(`Kickboard set to ${$("kickrows").value} rows. Editor cleared.`));
$("dropLayout").onclick = () => resetDefault("Default 12x12 layout restored.");
$("save").onclick = () => download("climb.json", { holds: [...state.holds].map(([position, color]) => ({ position, color })) });
$("load").onclick = () => pickFile("climb");
$("loadLayout").onclick = () => pickFile("layout");

buildPalette(); useDefaultLayout(); renderBoard();
log("Ready. Connect, tap holds, hit Send. Lit holds are unlimited.");
</script>
</body>
</html>
